<!DOCTYPE html>
<html lang="pt-pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MathLogi Lab</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css">

  <style>
    :root { --primary:#0b3163; --accent:#00a774; --danger:#d00000; --gold:#ffd700; --muted:#e7ecf3; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI', Tahoma, sans-serif; background:var(--primary); color:#333; overflow-x:hidden; }

    /* Login */
    #login-screen { height:100vh;
      background:url('https://raw.githubusercontent.com/mathlogi/quiz/main/PREPARA%C3%87%C3%83O%20EXAME%209%C2%BAANO%20(10).svg') no-repeat center center/cover;
      display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:12vh; }
    .input-wrapper { background:#fff; border-radius:50px; padding:5px 15px; width:85%; max-width:450px; display:flex; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    #player-name-input { border:none; padding:12px; width:100%; outline:none; text-align:center; font-size:16px; }
    #ok-btn { background:var(--accent); color:#fff; border:none; padding:10px 25px; border-radius:50px; cursor:pointer; font-weight:bold; }

    /* Menu */
    #quiz-selection { display:none; text-align:center; padding:40px; background:#f0f2f5; min-height:100vh; }
    #quiz-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; max-width:1100px; margin:0 auto; }
    .quiz-card { background:#fff; padding:25px; border-radius:15px; border-top:6px solid var(--primary); box-shadow:0 4px 10px rgba(0,0,0,0.1); }

    /* Game UI */
    .top-bar { background:var(--primary); color:#fff; padding:15px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; gap:10px; }
    #left-top { display:flex; align-items:center; gap:10px; }
    #streak-icon { display:none; padding:4px 10px; border-radius:20px; background:rgba(255,140,0,.18); border:1px solid rgba(255,140,0,.35); font-weight:800; }
    #timer-bar-container { height:8px; background:rgba(255,255,255,0.2); width:100%; }
    #timer-bar { height:100%; background:var(--accent); width:100%; transition:width 1s linear; }
    #timer-bar.paused { background:#888; }
    
    .powerups { display:flex; justify-content:center; gap:15px; margin:15px 0; flex-wrap:wrap; }
    .pwr-btn { background:#fff; border:2px solid var(--gold); padding:8px 15px; border-radius:10px; cursor:pointer; font-weight:bold; }
    .pwr-btn:disabled { opacity:0.3; filter:grayscale(1); cursor:not-allowed; }
    
    .box { background:#fff; padding:30px; border-radius:20px; margin:10px auto; max-width:950px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.2); width:95%; }
    #math-field { width:100%; max-width:850px; margin:15px auto; padding:15px; border:2px solid #ddd; border-radius:10px; font-size:24px; min-height:55px; }

    /* Teclado Avançado por Abas */
    .kb-tabs { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-bottom:10px; }
    .kb-tab { background:#fff; color:var(--primary); border:1.5px solid var(--primary); padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; }
    .kb-tab.active { background:var(--primary); color:#fff; }

    #math-keyboard { background:var(--muted); border:1px solid #d6dde8; border-radius:12px; padding:12px; max-width:900px; margin:0 auto; }
    .kb-group { display:none; flex-direction:column; gap:8px; }
    .kb-group.active { display:flex; }
    .kb-row { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; width:100%; }
    .kb-btn { background:#fff; border:1px solid #bbc4d1; color:var(--primary); padding:10px; border-radius:8px; cursor:pointer; font-size:15px; min-width:46px; min-height:42px; font-weight:600; transition: 0.2s; }
    .kb-btn:hover { background: #f0f4f8; border-color: var(--primary); }
    .kb-btn.wide { min-width:80px; }

    .options { display:grid; grid-template-columns: 1fr 1fr; gap:15px; max-width:900px; margin: 20px auto; width:95%; }
    .opt-btn { background:var(--primary); color:#fff; border:2px solid #fff; padding:20px; border-radius:15px; font-size:18px; cursor:pointer; min-height:80px; transition: 0.2s; }
    .opt-btn:hover { background: var(--accent); }
    .opt-btn.wrong-option { visibility:hidden; pointer-events:none; }

    /* Feedback Overlay */
    #feedback { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; z-index:9999; text-align:center; background:rgba(0,0,0,0.95); padding:30px; cursor:pointer; }
    .fb-math-ans { font-size:38px; background:rgba(255,255,255,0.1); padding:25px 50px; border-radius:15px; border:2px solid var(--accent); margin-top:20px; min-width:260px; }
    #fb-details { margin-top:10px; font-size:18px; font-weight:600; color: var(--gold); }

    /* Ranking */
    #rank-screen { text-align:center; padding:40px; background:#f0f2f5; min-height:100vh; }
    table { width:100%; max-width:640px; margin:20px auto; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    th { background:var(--primary); color:#fff; padding:15px; }
    td { padding:12px; border-bottom:1px solid #eee; text-align:center; }
    
    .hidden { display:none !important; }
    .submit-btn { background:var(--accent); padding:15px 50px; border:none; color:#fff; border-radius:50px; cursor:pointer; font-weight:bold; font-size:18px; transition: 0.3s; }
    .submit-btn:hover { transform: scale(1.05); background: #008f63; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="input-wrapper">
      <input type="text" id="player-name-input" placeholder="INTRODUZ O TEU NOME..." />
      <button id="ok-btn">OK</button>
    </div>
  </div>

  <div id="quiz-selection">
    <img src="https://raw.githubusercontent.com/mathlogi/quiz/main/PREPARA%C3%87%C3%83O%20EXAME%209%C2%BAANO%20(11).svg" style="max-width:180px; margin-bottom:20px;" alt="MathLogi Lab">
    <div id="quiz-list"></div>
  </div>

  <div id="game-ui" class="hidden">
    <div class="top-bar">
      <div id="left-top">
        <span id="q-info">Questão</span>
        <span id="streak-icon">🔥 x0</span>
      </div>
      <span id="score-val">0 pts</span>
      <span id="t-txt">120s</span>
    </div>
    <div id="timer-bar-container"><div id="timer-bar"></div></div>

    <div class="powerups">
  <button id="pwr-50" class="pwr-btn">🌓 50/50</button>
  <button id="pwr-x3" class="pwr-btn">🚀 PONTOS x3</button>
  <button id="pwr-stop" class="pwr-btn">⏳ STOP TEMPO</button>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

<script src="perguntas.js"></script>
<script src="app.js"></script>

    <div class="box">
      <div id="img-q"></div>
      <div id="txt-q"></div>

      <div id="short-zone" class="hidden">
        <div id="math-field"></div>

        <div class="kb-tabs" id="kb-tabs">
          <button class="kb-tab active" data-tab="basic">Básico</button>
          <button class="kb-tab" data-tab="algebra">Álgebra</button>
          <button class="kb-tab" data-tab="triglog">Trig/Logs</button>
          <button class="kb-tab" data-tab="calc">Cálculo</button>
          <button class="kb-tab" data-tab="sets">Conj./Lógica</button>
          <button class="kb-tab" data-tab="vectors">Vetores</button>
          <button class="kb-tab" data-tab="complex">Complexos</button>
          <button class="kb-tab" data-tab="edit">Edição</button>
        </div>

        <div id="math-keyboard">
          <div class="kb-group active" data-tab="basic">
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('7')">7</button>
              <button class="kb-btn" onclick="mqWrite('8')">8</button>
              <button class="kb-btn" onclick="mqWrite('9')">9</button>
              <button class="kb-btn" onclick="mqWrite('+')">+</button>
              <button class="kb-btn" onclick="mqWrite('-')">−</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('4')">4</button>
              <button class="kb-btn" onclick="mqWrite('5')">5</button>
              <button class="kb-btn" onclick="mqWrite('6')">6</button>
              <button class="kb-btn" onclick="mqWrite('\\cdot')">×</button>
              <button class="kb-btn" onclick="mqWrite('\\div')">÷</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('1')">1</button>
              <button class="kb-btn" onclick="mqWrite('2')">2</button>
              <button class="kb-btn" onclick="mqWrite('3')">3</button>
              <button class="kb-btn" onclick="mqWrite('0')">0</button>
              <button class="kb-btn" onclick="mqWrite('.')">.</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn wide" onclick="mqWrite('\\frac{}{}')">a/b</button>
              <button class="kb-btn" onclick="mqWrite('^{}')">xⁿ</button>
              <button class="kb-btn" onclick="mqWrite('_{}')">xₙ</button>
              <button class="kb-btn" onclick="mqWrite('\\sqrt{}')">√</button>
              <button class="kb-btn" onclick="mqWrite('\\sqrt[]{}')">ⁿ√</button>
              <button class="kb-btn" onclick="mqWrite('(')">(</button>
              <button class="kb-btn" onclick="mqWrite(')')">)</button>
              <button class="kb-btn" onclick="mqWrite('[')">[</button>
              <button class="kb-btn" onclick="mqWrite(']')">]</button>
              <button class="kb-btn" onclick="mqWrite('\\{')">{</button>
              <button class="kb-btn" onclick="mqWrite('\\}')">}</button>
              <button class="kb-btn" onclick="mqWrite('| |')">| |</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('\\pi')">π</button>
              <button class="kb-btn" onclick="mqWrite('e')">e</button>
              <button class="kb-btn" onclick="mqWrite('x')">x</button>
              <button class="kb-btn" onclick="mqWrite('y')">y</button>
              <button class="kb-btn" onclick="mqWrite('z')">z</button>
              <button class="kb-btn" onclick="mqWrite('=')">=</button>
              <button class="kb-btn" onclick="mqWrite(',')">,</button>
            </div>
          </div>

          <div class="kb-group" data-tab="algebra">
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('a')">a</button>
              <button class="kb-btn" onclick="mqWrite('b')">b</button>
              <button class="kb-btn" onclick="mqWrite('c')">c</button>
              <button class="kb-btn" onclick="mqWrite('m')">m</button>
              <button class="kb-btn" onclick="mqWrite('n')">n</button>
              <button class="kb-btn" onclick="mqWrite('\\binom{}{}')">nCk</button>
              <button class="kb-btn" onclick="mqWrite('\\approx')">≈</button>
              <button class="kb-btn" onclick="mqWrite('\\propto')">∝</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('<')">&lt;</button>
              <button class="kb-btn" onclick="mqWrite('>')">&gt;</button>
              <button class="kb-btn" onclick="mqWrite('\\le')">≤</button>
              <button class="kb-btn" onclick="mqWrite('\\ge')">≥</button>
              <button class="kb-btn" onclick="mqWrite('\\neq')">≠</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn wide" onclick="mqWrite('\\begin{cases} \\\\ \\end{cases}')">Sistema {}</button>
              <button class="kb-btn" onclick="mqWrite('\\overline{}')">sobrelinha</button>
              <button class="kb-btn" onclick="mqWrite('\\lfloor\\rfloor')">⌊ ⌋</button>
              <button class="kb-btn" onclick="mqWrite('\\lceil\\rceil')">⌈ ⌉</button>
            </div>
          </div>

          <div class="kb-group" data-tab="triglog">
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('\\sin')">sin</button>
              <button class="kb-btn" onclick="mqWrite('\\cos')">cos</button>
              <button class="kb-btn" onclick="mqWrite('\\tan')">tan</button>
              <button class="kb-btn" onclick="mqWrite('\\arcsin')">arcsin</button>
              <button class="kb-btn" onclick="mqWrite('\\arccos')">arccos</button>
              <button class="kb-btn" onclick="mqWrite('\\arctan')">arctan</button>
              <button class="kb-btn" onclick="mqWrite('^{{-1}}')">x⁻¹</button>
              <button class="kb-btn" onclick="mqWrite('^\\circ')">°</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('\\ln')">ln</button>
              <button class="kb-btn" onclick="mqWrite('\\log')">log</button>
              <button class="kb-btn wide" onclick="mqWrite('\\log_{}()')">log₍₎ base</button>
            </div>
          </div>

          <div class="kb-group" data-tab="calc">
            <div class="kb-row">
              <button class="kb-btn wide" onclick="mqWrite('\\lim_{x\\to }')">lim x→</button>
              <button class="kb-btn" onclick="mqWrite('\\to')">→</button>
              <button class="kb-btn wide" onclick="mqWrite('\\frac{d}{dx}')">d/dx</button>
              <button class="kb-btn" onclick="mqWrite('\\int')">∫</button>
              <button class="kb-btn wide" onclick="mqWrite('\\int_{}^{}')">∫ a^b</button>
              <button class="kb-btn" onclick="mqWrite('\\sum_{}^{}')">∑</button>
              <button class="kb-btn" onclick="mqWrite('\\prod_{}^{}')">∏</button>
            </div>
          </div>

          <div class="kb-group" data-tab="sets">
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('\\in')">∈</button>
              <button class="kb-btn" onclick="mqWrite('\\notin')">∉</button>
              <button class="kb-btn" onclick="mqWrite('\\subset')">⊂</button>
              <button class="kb-btn" onclick="mqWrite('\\subseteq')">⊆</button>
              <button class="kb-btn" onclick="mqWrite('\\cup')">∪</button>
              <button class="kb-btn" onclick="mqWrite('\\cap')">∩</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('\\forall')">∀</button>
              <button class="kb-btn" onclick="mqWrite('\\exists')">∃</button>
              <button class="kb-btn" onclick="mqWrite('\\neg')">¬</button>
              <button class="kb-btn" onclick="mqWrite('\\land')">∧</button>
              <button class="kb-btn" onclick="mqWrite('\\lor')">∨</button>
              <button class="kb-btn" onclick="mqWrite('\\implies')">⇒</button>
              <button class="kb-btn" onclick="mqWrite('\\iff')">⇔</button>
            </div>
          </div>

          <div class="kb-group" data-tab="vectors">
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('\\vec{v}')">→v</button>
              <button class="kb-btn" onclick="mqWrite('\\cdot')">·</button>
              <button class="kb-btn" onclick="mqWrite('\\times')">×</button>
              <button class="kb-btn wide" onclick="mqWrite('\\|\\|\\,\\|\\|')">‖ ‖</button>
              <button class="kb-btn" onclick="mqWrite('\\angle')">∠</button>
            </div>
            <div class="kb-row">
              <button class="kb-btn wide" onclick="mqWrite('\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}')">Matriz 2×2</button>
              <button class="kb-btn wide" onclick="mqWrite('\\begin{pmatrix}  \\end{pmatrix}')">( ) matriz</button>
            </div>
          </div>

          <div class="kb-group" data-tab="complex">
            <div class="kb-row">
              <button class="kb-btn" onclick="mqWrite('i')">i</button>
              <button class="kb-btn" onclick="mqWrite('\\overline{z}')">z̄</button>
              <button class="kb-btn" onclick="mqWrite('\\Re')">Re</button>
              <button class="kb-btn" onclick="mqWrite('\\Im')">Im</button>
              <button class="kb-btn" onclick="mqWrite('\\infty')">∞</button>
              <button class="kb-btn" onclick="mqWrite('\\alpha')">α</button>
              <button class="kb-btn" onclick="mqWrite('\\beta')">β</button>
              <button class="kb-btn" onclick="mqWrite('\\gamma')">γ</button>
              <button class="kb-btn" onclick="mqWrite('\\theta')">θ</button>
              <button class="kb-btn" onclick="mqWrite('\\lambda')">λ</button>
              <button class="kb-btn" onclick="mqWrite('\\mu')">μ</button>
              <button class="kb-btn" onclick="mqWrite('\\sigma')">σ</button>
              <button class="kb-btn" onclick="mqWrite('\\phi')">φ</button>
              <button class="kb-btn" onclick="mqWrite('\\omega')">ω</button>
            </div>
          </div>

          <div class="kb-group" data-tab="edit">
            <div class="kb-row">
              <button class="kb-btn wide" onclick="mqKey('Backspace')">⌫ Apagar</button>
              <button class="kb-btn" onclick="mqKey('Left')">◀</button>
              <button class="kb-btn" onclick="mqKey('Right')">▶</button>
              <button class="kb-btn wide" onclick="mqClear()">C Limpar</button>
              <button class="kb-btn wide" onclick="checkShort()">Enter</button>
            </div>
          </div>
        </div>

        <br><button id="short-submit" class="submit-btn">SUBMETER</button>
      </div>
    </div>
    <div id="opt-grid" class="options"></div>
  </div>

  <div id="feedback">
    <div id="fb-icon"></div>
    <div id="fb-msg"></div>
    <div id="fb-details"></div>
    <div id="fb-correct-ans" class="fb-math-ans"></div>
    <div style="margin-top:15px; opacity:.8; font-size:14px;">Toca para continuar</div>
  </div>

  <div id="rank-screen" class="hidden">
    <h2 style="color:var(--primary)">Quiz Concluído!</h2>
    <div id="res-grade" style="font-size:60px; font-weight:bold; color:var(--accent); margin-bottom:10px;"></div>
    <div id="wrong-msg" style="margin-bottom: 20px;"></div>
    <table id="table"></table>
    <br><button id="btn-back" class="submit-btn" style="background:var(--primary)">VOLTAR AO MENU</button>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

  <script src="perguntas.js"></script>
  <script src="app.js"></script>
</body>
</html>
